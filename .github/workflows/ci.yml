name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agent.py sample
  sample-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aks-pilot-sample sample
      - name: Verify restricted sample runtime
        run: |
          docker run -d --name sample --read-only --cap-drop ALL --security-opt no-new-privileges --memory 128m --cpus 0.25 -p 127.0.0.1:8080:8080 aks-pilot-sample
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q 'AKS pilot ready'; then exit 0; fi
            sleep 1
          done
          docker logs sample
          exit 1
      - if: always()
        run: docker rm -f sample || true
