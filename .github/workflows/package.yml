name: Build sample image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and package application
        run: |
          python -m unittest discover -s tests -p test_sample.py -v
          python -m pip wheel --no-deps --wheel-dir dist-artifacts ./sample
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image repository
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/sample" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: sample
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable release
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: ${{ github.sha }}
        run: |
          python - <<'PYCODE'
          import json, os, tomllib
          from pathlib import Path
          ref=os.environ['IMAGE']+'@'+os.environ['DIGEST']
          Path('dist-artifacts/release.json').write_text(json.dumps({'image':ref,'source_commit':os.environ['SOURCE'],'version':tomllib.loads(Path('sample/pyproject.toml').read_text())['project']['version']},indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Immutable image: `'+ref+'`\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: sample-release
          path: dist-artifacts/
          retention-days: 14
