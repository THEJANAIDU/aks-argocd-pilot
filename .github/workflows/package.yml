name: Build sample image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image repository
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/sample" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: sample
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Report immutable deployment reference
        run: echo '${{ env.IMAGE }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
